<div class="orderbox" id="orderBox"><div class="orderpanel">
<button class="close" onclick="closeOrder()">×</button><h2>🛍️ অর্ডার করুন</h2>
<form id="orderForm" onsubmit="sendOrder(event)">
<div class="formrow"><label>পণ্য</label><input id="product" readonly></div>
<div class="formrow"><label>পরিমাণ</label><input id="qty" type="number" min="1" value="1" required></div>
<div class="formrow"><label>আপনার নাম</label><input id="name" required placeholder="নাম লিখুন"></div>
<div class="formrow"><label>মোবাইল নম্বর</label><input id="phone" type="tel" required placeholder="01XXXXXXXXX"></div>
<div class="formrow"><label>ডেলিভারি ঠিকানা</label><textarea id="address" rows="3" required placeholder="বাড়ি/এলাকা/থানা/জেলা"></textarea></div>
<div class="formrow"><label>পেমেন্ট পদ্ধতি</label><div class="payments">
<label><input type="radio" name="pay" value="bKash" required> 🟢 bKash</label>
<label><input type="radio" name="pay" value="Nagad"> 🟠 Nagad</label>
<label><input type="radio" name="pay" value="Rocket"> 🔵 Rocket</label>
<label><input type="radio" name="pay" value="Cash on Delivery"> 💵 Cash on Delivery</label>
</div></div>
<p class="small">অনলাইন পেমেন্ট বেছে নিলে অর্ডার পাঠানোর পর দোকানের পক্ষ থেকে পেমেন্ট নম্বর/নির্দেশনা জানানো হবে।</p>
<button class="btn submit" id="submitBtn" type="submit">✅ অর্ডার কনফার্ম করুন</button>
<div id="orderStatus" class="small" style="margin-top:12px;text-align:center"></div>
</form></div></div>
<footer>
<strong>আয়রা কসমেটিকস</strong>
<p>Be Beautiful, Be You 💗</p>
<p class="small">ধর্মপুর চৌমনী, আদর্শ সদর, কুমিল্লা | 01609484590</p>
</footer>

<script>
const ORDER_API_URL = "https://script.google.com/macros/s/AKfycbzM9X2mD8TZRUmmyH0AtyPELWE_Jx4eWZacPqHiBRSZyMmn4fTaZwKtVJH4OfJdMHDY1w/exec";
let selectedPrice='';
function openOrder(product,price){
 document.getElementById('product').value=product;
 selectedPrice=price;
 document.getElementById('orderStatus').textContent='';
 document.getElementById('submitBtn').disabled=false;
 document.getElementById('orderBox').style.display='block';
}
function closeOrder(){document.getElementById('orderBox').style.display='none'}
function sendOrder(e){
 e.preventDefault();
 const product=document.getElementById('product').value;
 const qty=document.getElementById('qty').value;
 const name=document.getElementById('name').value.trim();
 const phone=document.getElementById('phone').value.trim();
 const address=document.getElementById('address').value.trim();
 const pay=document.querySelector('input[name="pay"]:checked')?.value || '';
 const btn=document.getElementById('submitBtn');
 const status=document.getElementById('orderStatus');
 btn.disabled=true; btn.textContent='⏳ অর্ডার পাঠানো হচ্ছে...'; status.textContent='';
 const formData=new URLSearchParams();
 formData.append('product',product); formData.append('quantity',qty); formData.append('name',name);
 formData.append('phone',phone); formData.append('address',address); formData.append('payment',pay);
 formData.append('total',selectedPrice);
 fetch(ORDER_API_URL,{method:'POST',body:formData,mode:'no-cors'})
   .then(()=>{
      document.getElementById('orderForm').reset();
      document.getElementById('product').value=product;
      status.innerHTML='🎉 <strong>আপনার অর্ডার সফলভাবে গ্রহণ করা হয়েছে!</strong><br>আয়রা কসমেটিকস থেকে শিগগিরই আপনার সাথে যোগাযোগ করা হবে।';
      btn.textContent='✅ অর্ডার কনফার্ম হয়েছে';
      setTimeout(()=>{closeOrder(); btn.textContent='✅ অর্ডার কনফার্ম করুন';},3500);
   })
   .catch(()=>{
      status.textContent='❌ অর্ডার পাঠানো যায়নি। অনুগ্রহ করে আবার চেষ্টা করুন।';
      btn.disabled=false; btn.textContent='✅ অর্ডার কনফার্ম করুন';
   });
}
</script>
